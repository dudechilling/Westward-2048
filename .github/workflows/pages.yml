name: Publish Westward 2048

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.mjs"
      - "engine.mjs"
      - "story.mjs"
      - "scene.mjs"
      - "style.css"
      - "engine.test.mjs"
      - "scene.test.mjs"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test simulation
        run: npm test
      - name: Stage static game
        run: |
          mkdir -p _site
          cp index.html app.mjs engine.mjs story.mjs scene.mjs style.css _site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
